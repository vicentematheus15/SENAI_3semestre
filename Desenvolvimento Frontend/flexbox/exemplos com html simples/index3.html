<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tela Centralizada</title>
  <link rel="stylesheet" href="style3.css">
</head>
<body>
  <main class="tela-login">
    <form class="card-login">
      <h1>Login</h1>
      <label>E-mail</label>

    </form>
  </main>
</body>
</html>
